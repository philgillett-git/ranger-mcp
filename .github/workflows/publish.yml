# Publishes @rangerwild/mcp-server to npm on a tagged release.
#
# Trigger: push a tag matching `vX.Y.Z` (semver). Example:
#   npm version 0.3.0 --no-git-tag-version
#   git commit -am "chore: bump @rangerwild/mcp-server to 0.3.0"
#   git push origin main
#   git tag v0.3.0
#   git push origin v0.3.0
#
# Auth: npm Trusted Publishing (OIDC). No NPM_TOKEN secret anywhere — the
# GitHub Actions runner mints a short-lived OIDC token, npm verifies it against
# the trusted-publisher config on the @rangerwild/mcp-server package, and
# returns a one-shot publish credential. The published tarball carries a
# sigstore provenance bundle tying it to this repo + commit + workflow.
#
# Provenance signing requires a PUBLIC source repository, which this repo is.

name: Publish @rangerwild/mcp-server

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # required for OIDC (Trusted Publishing + provenance signing)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22 (required for npm Trusted Publishing)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm to 11.5.1+ for Trusted Publishing
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
          echo "OK: tag v$TAG matches package.json $PKG"

      - name: Publish to npm (Trusted Publishing + provenance)
        run: npm publish --access public --provenance
