# Runs on every PR and push to main. Keeps the quality bar up without
# depending on the monorepo preflight. The live smoke step runs only when
# a SMOKE_API_KEY secret is set on the repo; otherwise it's skipped cleanly.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Live smoke (only when SMOKE_API_KEY is configured)
        if: ${{ env.SMOKE_API_KEY != '' }}
        env:
          SMOKE_API_KEY: ${{ secrets.SMOKE_API_KEY }}
          RANGER_API_KEY: ${{ secrets.SMOKE_API_KEY }}
        run: npm run smoke
